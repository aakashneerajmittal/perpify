# Render Blueprint — Perpify engine (one-click deploy).
# In Render: New → Blueprint → pick the `perpify` repo → Apply. This creates the web
# service fully configured (Docker build of Dockerfile.engine, Starter plan, persistent disk
# for the durable command log, health check, allowed origins). No manual field entry.
services:
  - type: web
    name: perpify-engine
    runtime: docker
    dockerfilePath: ./Dockerfile.engine
    dockerContext: .
    # Starter (always-on) instead of free: free sleeps after ~15 min idle (cold-start for the
    # next trader) AND has an ephemeral filesystem that would wipe the command log on every
    # restart. Starter stays up and supports the persistent disk below.
    plan: starter
    healthCheckPath: /
    autoDeploy: true
    # Durable command log — the engine replays this on boot, so trader balances/positions survive
    # restarts and redeploys. Written to PERPIFY_DATA_DIR (=/data) below.
    disk:
      name: perpify-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # Command log lives on the persistent disk (mountPath above) → replay-on-boot is durable.
      - key: PERPIFY_DATA_DIR
        value: /data
      # Must match the frontend's exact origin. demo.perpify.trade is the planned demo URL;
      # add/adjust here (comma-separated) if the frontend is served elsewhere. Keep `null`.
      - key: ALLOWED_ORIGINS
        value: "*"
      # ── On-chain settlement (Base Sepolia) — OFF by default ──────────────────────────────
      # The image runs off-chain for a reliable demo. To turn live epoch settlement / deposit
      # scanning ON, set all three below in the Render dashboard (sync:false = Render prompts you
      # for the value; nothing secret is committed). Use a DEDICATED testnet key holding only
      # Base Sepolia ETH for gas — never a key with real funds. Remove PERPIFY_ONCHAIN to roll back.
      - key: PERPIFY_ONCHAIN
        sync: false # set to "1" to override the image's --offline and go on-chain
      - key: PRIVATE_KEY
        sync: false # operator key (testnet gas only) — recovers cleanly to off-chain if unset
      - key: BASE_SEPOLIA_RPC_URL
        sync: false # optional; defaults to https://sepolia.base.org
